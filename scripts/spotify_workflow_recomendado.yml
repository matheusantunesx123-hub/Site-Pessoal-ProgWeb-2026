name: Atualizar dados do Spotify

on:
  schedule:
    # Executa a cada 3 horas para capturar praticamente 100% do histórico mensal
    - cron: "0 */3 * * *"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

jobs:
  update-spotify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Atualizar dados do Spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python scripts/spotify.py

      - name: Verificar alterações
        id: changes
        run: |
          if [ -n "$(git status --porcelain -- spotify/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Salvar dados atualizados
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add spotify/

          git commit -m "Atualizar dados e arquivo mensal do Spotify"

          git pull --rebase origin main || true

          git push
